# PEANUTS: builds the Sunflower Seeds test app on a GitHub-hosted Linux runner and publishes it as a release, which the app's updater offers (Updater.sources:
# an app ID ending in .sunflowertest asks this repository's releases). The app is dev.nxnative.android.<app_id> with the profiles of the games given; the pack
# comes from scripts/pack_android.py on a PC (-PnxPackEngine=fake). Every build is signed with the one key in the SIGN_KEYSTORE_B64 secret (a PKCS12 debug
# keystore, base64: alias androiddebugkey, password android), handed to the build through Gradle's injected signing properties (a debug keystore in ~/.android
# is not what the runner's build signs with), and the APK's certificate is checked against SIGNER, so each release installs over the last. Version
# 0.2.<run number>, which only grows.
name: test-apk

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Title IDs, comma-separated (dm/games/<title ID>)'
        required: true
        default: '0100AA7024094000'
      app_id:
        description: 'dev.nxnative.android.<app_id> (lower-case letters and digits)'
        required: true
        default: 'sunflowertest'
      label:
        description: 'App name on the device'
        required: true
        default: 'Sunflower Seeds test'
  push:
    branches: [mlb-the-show-26]
    paths: ['.github/workflows/test-apk.yml', 'dm/games/0100AA7024094000/**', 'android/**', 'dm/host/**', 'dm/gfx/**']

permissions:
  contents: write   # the release

defaults:
  run:
    shell: bash

concurrency:
  group: test-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: 0.2.${{ github.run_number }}
      SIGNER: a18da09242e9bebbbec26e1b4a43e762d51522391b5a22cbc87299c8e1515a82   # the SHA-256 of the key's certificate, as apksigner prints it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: The packages the build's Python tools import
        run: python -m pip install lz4==4.4.5 capstone==5.0.9 fonttools==4.67.0
      - name: Android SDK packages (platform 36, build-tools 36.0.0, NDK 28.2, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: The signing key
        env:
          KEY: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the SIGN_KEYSTORE_B64 secret is missing: without it each build has a new key and cannot install over the last"; exit 1; }
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/sign.keystore"
      - name: Build
        env:
          GAMES: ${{ inputs.games || '0100AA7024094000' }}
          APP_ID: ${{ inputs.app_id || 'sunflowertest' }}
          LABEL: ${{ inputs.label || 'Sunflower Seeds test' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          cd android/app
          ./gradlew --no-daemon apk -PnxApp=peanuts "-PnxAppId=$APP_ID" "-PnxLabel=$LABEL" "-PnxGames=$GAMES" -PnxPackEngine=fake \
            "-PnxVersion=$VERSION" "-PnxVersionCode=$((100 + ${{ github.run_number }}))" \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/sign.keystore" -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          mv out/nxnative-android-peanuts.apk "out/sunflower-seeds-test-$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "out/sunflower-seeds-test-$VERSION.apk" | tee certs.txt
          grep -q "SHA-256 digest: $SIGNER" certs.txt || { echo "::error::the APK is not signed with the SIGN_KEYSTORE_B64 key"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sunflower-seeds-test-apk
          path: android/app/out/sunflower-seeds-test-*.apk
          if-no-files-found: error
      - name: Release (what the app's updater offers)
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "${MSG:-Manual build}" | head -n 1 > notes.md
          gh release create "v$VERSION" "android/app/out/sunflower-seeds-test-$VERSION.apk" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Sunflower Seeds test $VERSION" --notes-file notes.md
