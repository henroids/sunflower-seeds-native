# PEANUTS: builds a test app (peanuts/docs/NEW-GAME.md step 6) on a GitHub-hosted Linux runner, for a contributor without the Android SDK at hand.
# The app is dev.nxnative.android.<app_id>: an app of its own beside the release, with its own data, carrying the profiles of the games given. The simulated
# on-device packer (-PnxPackEngine=fake): the pack comes from scripts/pack_android.py on a PC. The debug signing key is kept in the Actions cache, so a
# later build installs over the earlier one (adb install -r) while the cache lives (7 days unused); after that, uninstall the test app first.
name: test-apk

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Title IDs, comma-separated (dm/games/<title ID>)'
        required: true
        default: '0100AA7024094000'
      app_id:
        description: 'dev.nxnative.android.<app_id> (lower-case letters and digits)'
        required: true
        default: 'sunflowertest'
      label:
        description: 'App name on the device'
        required: true
        default: 'Sunflower Seeds test'
  push:
    branches: [mlb-the-show-26]
    paths: ['.github/workflows/test-apk.yml', 'dm/games/0100AA7024094000/**', 'android/**', 'dm/host/**', 'dm/gfx/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: The packages the build's Python tools import
        run: python -m pip install lz4==4.4.5 capstone==5.0.9 fonttools==4.67.0
      - name: Android SDK packages (platform 36, build-tools 36.0.0, NDK 28.2, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Debug signing key (kept between runs)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build
        env:
          GAMES: ${{ inputs.games || '0100AA7024094000' }}
          APP_ID: ${{ inputs.app_id || 'sunflowertest' }}
          LABEL: ${{ inputs.label || 'Sunflower Seeds test' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 --version
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          cd android/app
          ./gradlew --no-daemon apk -PnxApp=peanuts "-PnxAppId=$APP_ID" "-PnxLabel=$LABEL" "-PnxGames=$GAMES" -PnxPackEngine=fake
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peanuts-test-apk
          path: android/app/out/nxnative-android-peanuts.apk
          if-no-files-found: error
